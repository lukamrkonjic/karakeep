[package]
name = "vrana"
version = "0.1.1"
description = "vrana as a Mac or Windows app: a Tauri window around the web app"
edition = "2021"
publish = false

[lib]
name = "vrana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.6"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The window's WKWebView and NSWindow (the versions wry uses): the two-finger
# swipe back, and the window's buttons in vrana's header.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", features = ["WKWebView"] }
# The window's buttons, placed in vrana's header.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

# A second launch on Windows focuses the open window (a Mac does that itself).
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"

# The title bar in vrana's colours (the version Tauri's window uses).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
