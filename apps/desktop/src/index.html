<!doctype html>
<!--
  The app's own page (src-tauri/src/lib.rs): shown for a moment while vrana
  opens the server, and when it can't — then it asks for the server's
  address (also under vrana → Change Server…). Everything else is the web app.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vrana</title>
    <style>
      :root {
        --bg: #fbfaf7;
        --fg: #2a2723;
        --muted: #7a746b;
        --field: #ffffff;
        --line: #e4ded3;
        --danger: #b3261e;
        --accent: #286ff0;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #191715;
        --fg: #ece6dc;
        --muted: #9b948a;
        --field: #221f1c;
        --line: #37332f;
        --danger: #ef8a80;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      main.ready {
        opacity: 1;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .logo svg {
        width: 36px;
        height: 36px;
      }
      .status {
        color: var(--muted);
        min-height: 21px;
      }
      form {
        display: none;
        flex-direction: column;
        gap: 10px;
        width: min(360px, 100%);
      }
      form.shown {
        display: flex;
      }
      label {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--fg);
        font: inherit;
        user-select: text;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        color: var(--danger);
        font-size: 13px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main data-tauri-drag-region="deep">
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14.4" fill="#286FF0" />
          <g transform="translate(8.236 6.723) scale(0.7454)">
            <path
              fill="#FBFAF7"
              fill-rule="evenodd"
              d="M 62 25.2 C 58.6 19 53.6 15.2 46.4 13.6 C 43.4 10.2 37.6 9.6 33.4 12.2 C 27.6 15.8 24.4 22.6 21.4 29.4 C 18.6 35.6 14.4 40.8 10 45.6 L 1.8 52.6 L 5.6 56.8 L 20.2 48.8 C 30.6 48.8 40.6 45.4 44.8 37.2 C 45.8 35 46.2 32.6 46.4 30.6 C 47.6 29.2 47.6 27.6 47 26.2 C 51.8 25.2 56.8 24.9 62 25.2 Z M 42.4 17.2 a 1.6 1.6 0 1 0 0.01 0 Z"
            />
            <path
              fill="none"
              stroke="#FBFAF7"
              stroke-width="2.6"
              stroke-linecap="round"
              d="M 28.6 48.6 L 29.4 56 M 34.2 47.4 L 35.2 56"
            />
          </g>
        </svg>
        vrana
      </div>
      <p class="status" id="status"></p>
      <form id="form">
        <label for="address">Your vrana server</label>
        <div class="row">
          <input
            id="address"
            type="url"
            placeholder="https://nas.your-tailnet.ts.net"
            autocomplete="url"
            spellcheck="false"
            required
          />
          <button id="connect" type="submit">Open</button>
        </div>
        <p class="error" id="error"></p>
      </form>
    </main>
    <script>
      const { invoke } = window.__TAURI_INTERNALS__;
      const main = document.querySelector("main");
      const status = document.getElementById("status");
      const form = document.getElementById("form");
      const input = document.getElementById("address");
      const button = document.getElementById("connect");
      const error = document.getElementById("error");

      function ask(address, message) {
        status.textContent = "";
        input.value = address || "";
        error.textContent = message || "";
        form.classList.add("shown");
        input.focus();
        input.select();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        error.textContent = "";
        try {
          await invoke("connect", { address: input.value });
        } catch (message) {
          error.textContent = String(message);
          button.disabled = false;
        }
      });

      (async () => {
        const { address, theme } = await invoke("startup");
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = theme || (dark ? "dark" : "light");
        main.classList.add("ready");
        // Change Server… comes here with ?change.
        if (!address || new URLSearchParams(location.search).has("change")) {
          ask(address, "");
          return;
        }
        // Said only when it takes a moment.
        const slow = setTimeout(() => (status.textContent = "Opening vrana…"), 600);
        try {
          await invoke("connect", { address });
        } catch (message) {
          clearTimeout(slow);
          ask(address, String(message));
        }
      })();
    </script>
  </body>
</html>
