<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <title>Karakeep</title>
    <!-- Fork: what the installed app shows when the server can't be reached
         (public/service-worker.js). No external files: it has to work offline. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #71717a;
        --button: #f4f4f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --button: #27272a;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      }
      main {
        padding: 24px;
        max-width: 420px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--button);
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Karakeep can't be reached</h1>
      <p>
        You're offline, or your Karakeep server isn't answering. Check the
        connection, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
