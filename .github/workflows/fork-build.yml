name: Build Fork Image

# Builds the all-in-one karakeep image from this fork and pushes it to
# ghcr.io/<your-username>/karakeep:latest using the built-in GITHUB_TOKEN.
# No secrets/PAT needed. amd64 only (Synology DS923+ is x86_64).

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/karakeep:latest
          build-args: SERVER_VERSION=fork
          cache-from: type=gha
          cache-to: type=gha,mode=max
