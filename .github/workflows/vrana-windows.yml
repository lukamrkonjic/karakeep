name: Build vrana for Windows

# The Windows installer of vrana (apps/desktop, Tauri), built on GitHub's
# Windows runner, which has Rust, MSVC and WebView2. The installer
# (vrana_<version>_x64-setup.exe, unsigned, as a local build) is attached to
# a draft release — only you see it, and a draft starts no other workflow —
# and kept as the run's artifact too. Runs on a push to the
# vrana-windows-build branch, or from the Actions tab once this file is on
# main. No server address is baked in: an installed vrana keeps its own.

on:
  push:
    branches:
      - vrana-windows-build
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install the Tauri CLI
        run: pnpm install --filter @karakeep/desktop --frozen-lockfile

      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm --config.verify-deps-before-run=false app:build

      - name: Version
        id: version
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: vrana_${{ steps.version.outputs.version }}_x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Draft release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: vrana-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: vrana ${{ steps.version.outputs.version }} for Windows
          body: |
            The Windows installer of vrana ${{ steps.version.outputs.version }}, built from ${{ github.sha }}.
            Unsigned: the first time, Windows may say "Windows protected your PC" — More info → Run anyway.
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true

      - name: Say where it is
        run: |
          $assets = '${{ steps.release.outputs.assets }}' | ConvertFrom-Json
          foreach ($a in $assets) { "::notice title=vrana installer::$($a.browser_download_url)" }
          "::notice title=vrana release::${{ steps.release.outputs.url }}"
